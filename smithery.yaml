# Smithery configuration for JUCESP: Ficha Cadastral Simplificada
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_ficha

name: jucesp_ficha-mcp
displayName: "JUCESP: Ficha Cadastral Simplificada"
description: >
  Ficha cadastral simplificada de uma empresa na JUCESP (dados de registro por CNPJ, NIRE ou nome). Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_ficha-mcp
repository: https://github.com/mcp-dir/jucesp_ficha-mcp

tags:
  - jucesp_ficha
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_ficha

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_ficha/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
